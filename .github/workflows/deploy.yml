name: SpendWise CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: spendwise-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/harish-045/expense-tracker:latest

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/spendwise_deploy
          chmod 600 ~/.ssh/spendwise_deploy

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy and verify SpendWise
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -eu

          ssh -i ~/.ssh/spendwise_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -eu

          cd "$HOME/spendwise-deploy"

          IMAGE="ghcr.io/harish-045/expense-tracker:latest"

          echo "Pulling latest SpendWise image..."
          sudo docker pull "$IMAGE"

          echo "Recreating SpendWise container..."
          SPENDWISE_IMAGE="$IMAGE" sudo -E docker compose \
            --env-file .env \
            -f compose.yaml \
            up -d --force-recreate

          echo "Waiting for SpendWise to become ready..."

          READY=0

          for attempt in $(seq 1 36); do
            if ! sudo docker inspect \
              -f '{{.State.Running}}' spendwise-ai 2>/dev/null |
              grep -qx true; then

              echo "Container is not running."
              sudo docker logs --tail 100 spendwise-ai || true
              exit 1
            fi

            HTTP_CODE=$(curl -sS \
              -o /dev/null \
              -w '%{http_code}' \
              --max-time 5 \
              http://127.0.0.1:8090/ 2>/dev/null || true)

            if [ "$HTTP_CODE" = "200" ]; then
              READY=1
              echo "Homepage returned HTTP 200."
              break
            fi

            echo "Attempt $attempt/36: HTTP ${HTTP_CODE:-unavailable}; waiting 5 seconds..."
            sleep 5
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: SpendWise did not become HTTP-ready."
            sudo docker logs --tail 150 spendwise-ai || true
            exit 1
          fi

          echo "Recent application logs:"
          sudo docker logs --tail 60 spendwise-ai

          echo "SpendWise deployment passed the HTTP readiness check."
          REMOTE