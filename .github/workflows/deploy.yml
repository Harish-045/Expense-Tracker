name: SpendWise CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: spendwise-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/harish-045/expense-tracker:latest

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/spendwise_deploy
          chmod 600 ~/.ssh/spendwise_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -eu

          ssh -i ~/.ssh/spendwise_deploy \
            "$EC2_USER@$EC2_HOST" \
            'set -eu
             cd "$HOME/spendwise-deploy"

             sudo docker pull ghcr.io/harish-045/expense-tracker:latest

             SPENDWISE_IMAGE=ghcr.io/harish-045/expense-tracker:latest \
               sudo -E docker compose --env-file .env -f compose.yaml up -d --force-recreate

             sleep 10

             if ! sudo docker inspect -f "{{.State.Running}}" spendwise-ai | grep -qx true; then
               sudo docker logs --tail 100 spendwise-ai
               exit 1
             fi

             echo "SpendWise container is running."
            '